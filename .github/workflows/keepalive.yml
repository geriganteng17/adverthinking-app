name: Supabase Keep-Alive
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (auth + REST = activity)
        run: |
          K="${{ secrets.SUPABASE_ANON_KEY }}"
          U="https://qpphkgywomddclhkhwlq.supabase.co"
          curl -s -o /dev/null -w "auth %{http_code}\n" "$U/auth/v1/health" -H "apikey: $K"
          curl -s -o /dev/null -w "rest %{http_code}\n" "$U/rest/v1/" -H "apikey: $K" -H "Authorization: Bearer $K"
