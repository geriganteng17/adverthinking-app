    <script>
        // Polyfill to resolve conflicts where libraries (like formdata-polyfill) attempt to assign window.fetch
        try {
            if (typeof window !== 'undefined') {
                // Ensure FormData prototype has keys to prevent formdata-polyfill from executing its assignment block
                if (typeof FormData !== 'undefined') {
                    if (!FormData.prototype.keys) {
                        FormData.prototype.keys = function* () {};
                    }
                    if (!FormData.prototype.values) {
                        FormData.prototype.values = function* () {};
                    }
                    if (!FormData.prototype.entries) {
                        FormData.prototype.entries = function* () {};
                    }
                    if (!FormData.prototype[Symbol.iterator]) {
                        FormData.prototype[Symbol.iterator] = FormData.prototype.entries;
                    }
                }

                // Make fetch descriptor writable on window in environments (like sandbox/iframes) where it has only a getter
                const desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
                if (desc && (!desc.writable || !desc.set)) {
                    let currentFetch = window.fetch;
                    try {
                        Object.defineProperty(window, 'fetch', {
                            get() { return currentFetch; },
                            set(v) { currentFetch = v; },
                            configurable: true,
                            enumerable: true
                        });
                    } catch (e) {
                        try {
                            Object.defineProperty(Object.getPrototypeOf(window), 'fetch', {
                                get() { return currentFetch; },
                                set(v) { currentFetch = v; },
                                configurable: true,
                                enumerable: true
                            });
                        } catch (err) {
                            console.warn("Could not patch fetch writeability:", err);
                        }
                    }
                }
            }
        } catch (e) {
            console.error("Fetch/FormData polyfill error:", e);
        }
    </script>
